name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main", "task-0.2-migrations" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: meridian_user
          POSTGRES_PASSWORD: meridian_pass
          POSTGRES_DB: meridian_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://meridian_user:meridian_pass@localhost:5432/meridian_db
      APP_DB_USER: meridian_app
      APP_DB_PASSWORD: meridian_app_pass
      APP_DATABASE_URL: postgresql+psycopg://meridian_app:meridian_app_pass@localhost:5432/meridian_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provision App DB Role
        env:
          PGPASSWORD: meridian_pass
          POSTGRES_HOST: localhost
          POSTGRES_USER: meridian_user
          POSTGRES_DB: meridian_db
        run: |
          ./docker/postgres-init/01-create-app-role.sh
          echo "Running a second time to verify idempotency:"
          ./docker/postgres-init/01-create-app-role.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff (Lint)
        run: uv run ruff check .

      - name: Run Mypy (Type Check)
        run: uv run mypy src/

      - name: Run Pytest
        run: uv run pytest tests/

      - name: Run pip-audit (Dependency Scan)
        run: uv run pip-audit
        continue-on-error: true # Report only, non-blocking as per Phase 0 Task 0.1 spec

  verify-docker-init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Docker Entrypoint
        run: |
          docker compose up -d db
          
          # Wait for it to be ready
          echo "Waiting for PostgreSQL..."
          until docker compose exec -T db pg_isready -U meridian_user -d meridian_db; do sleep 1; done
          
          # Wait a few more seconds for the init scripts to finish running
          sleep 5
          
          # Verify that the meridian_app role was created by the init script
          docker compose exec -T db psql -U meridian_user -d meridian_db -c "SELECT 1 FROM pg_roles WHERE rolname = 'meridian_app';" | grep 1
