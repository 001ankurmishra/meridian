[project]
name = "meridian"
version = "0.1.0"
description = "Meridian AML Copilot"
readme = "README.md"
authors = []
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "uvicorn>=0.29.0",
    "networkx>=3.6.1",
    "sentence-transformers>=6.0.1",
    "pgvector>=0.5.0",
]

[dependency-groups]
maintenance = ["alembic>=1.19.2"]
dev = [
    {include-group = "maintenance"},
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.3",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
]
ui = [
    "streamlit>=1.66.1",
    "requests>=2.31.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "meridian.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# Security floors for transitive dependencies reviewed during Phase B.
[tool.uv]
constraint-dependencies = [
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
    "setuptools>=84.1.0",
    "urllib3>=2.8.0",
    "pillow>=13.0.0",
]
