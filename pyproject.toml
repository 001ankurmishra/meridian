[project]
name = "meridian"
version = "0.1.0"
description = "Meridian AML Copilot"
readme = "README.md"
authors = []
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "uvicorn>=0.29.0",
]

[dependency-groups]
dev = [
    "alembic>=1.19.2",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.3",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "meridian.*"
disallow_untyped_defs = true
