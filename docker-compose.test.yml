name: meridian-test

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      - POSTGRES_USER=meridian_user
      - POSTGRES_PASSWORD=meridian_pass
      - POSTGRES_DB=meridian_test
      - APP_DB_USER=${APP_DB_USER:-meridian_app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-meridian_app_pass}
      - LOADER_DB_USER=${LOADER_DB_USER:-meridian_loader}
      - LOADER_DB_PASSWORD=${LOADER_DB_PASSWORD:-meridian_loader_pass}
      - DISPOSABLE_TEST_DB=true
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian_user -d meridian_test"]
      interval: 3s
      timeout: 3s
      retries: 10
