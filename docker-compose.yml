services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://meridian_user:meridian_pass@db:5432/meridian_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      - POSTGRES_USER=meridian_user
      - POSTGRES_PASSWORD=meridian_pass
      - POSTGRES_DB=meridian_db
      - APP_DB_USER=${APP_DB_USER:-meridian_app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-meridian_app_pass}
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian_user -d meridian_db"]
      interval: 5s
      timeout: 5s
      retries: 5
