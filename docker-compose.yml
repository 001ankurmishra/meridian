services:
  app:
    build: .
    image: meridian-prototype:local
    ports:
      - "127.0.0.1:${MERIDIAN_API_PORT:-8000}:8000"
    environment:
      - APP_DATABASE_URL=postgresql+psycopg://${APP_DB_USER:-meridian_app}:${APP_DB_PASSWORD:-meridian_app_pass}@db:5432/meridian_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12

  ui:
    image: meridian-prototype:local
    command: ["python", "-m", "streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.gatherUsageStats=false"]
    environment:
      - MERIDIAN_API_BASE_URL=http://app:8000
    ports:
      - "127.0.0.1:${MERIDIAN_UI_PORT:-8501}:8501"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12

  maintenance:
    image: meridian-prototype:local
    profiles: ["tools"]
    environment:
      - DATABASE_URL=postgresql+psycopg://meridian_user:${MERIDIAN_DB_PASSWORD:-meridian_pass}@db:5432/meridian_db
      - MAINTENANCE_DATABASE_URL=postgresql+psycopg://meridian_user:${MERIDIAN_DB_PASSWORD:-meridian_pass}@db:5432/meridian_db
      - LOADER_DATABASE_URL=postgresql+psycopg://${LOADER_DB_USER:-meridian_loader}:${LOADER_DB_PASSWORD:-meridian_loader_pass}@db:5432/meridian_db
      - APP_DB_USER=${APP_DB_USER:-meridian_app}
      - LOADER_DB_USER=${LOADER_DB_USER:-meridian_loader}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      - POSTGRES_USER=meridian_user
      - POSTGRES_PASSWORD=${MERIDIAN_DB_PASSWORD:-meridian_pass}
      - POSTGRES_DB=meridian_db
      - APP_DB_USER=${APP_DB_USER:-meridian_app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-meridian_app_pass}
      - LOADER_DB_USER=${LOADER_DB_USER:-meridian_loader}
      - LOADER_DB_PASSWORD=${LOADER_DB_PASSWORD:-meridian_loader_pass}
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - meridian_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${MERIDIAN_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian_user -d meridian_db"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  meridian_data:
